<!-- One page. React mounts into #root. The module script is Vite's entry. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skribbl</title>
    <!-- Icons. Files live in client/public and are served from the site root.
         The .ico (sizes="any") is the fallback for old browsers. Modern ones pick the SVG.
         Safari and iOS use the 180px touch icon, which is a full square because iOS adds its own corners. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ff8fb8" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
